# What replaces each library a source language's code imports, once the code is Mojo. `analyze`
# reports the first entry that matches: `names` match exactly, `prefixes` match the start of the
# name. A library missing here is reported as `unknown`, never guessed.
#
# replacement: a Mojo stdlib module (`std.os`), a Mojo package on pixi (`emberjson`), or
# `python:<module>` for a Python module called through CPython interop; `-` when nothing does.
# fit: good (it does the same job), partial (the common case; check the rest), none (keep it in
# the source language). For Python code, `python:<module>` is the same library and fits well; for
# every other language a Python module is a stand-in and fits partly at best.

[[ts]]
names = ["yaml", "js-yaml"]
replacement = "python:yaml"
fit = "partial"
note = "No YAML parser in Mojo: PyYAML through CPython interop. Comments and layout are not kept."

[[ts]]
names = ["json5"]
replacement = "python:json5"
fit = "partial"
note = "No JSON5 reader in Mojo: the `json5` package through CPython interop."

[[ts]]
names = ["jsonc-parser"]
replacement = "python:json5"
fit = "partial"
note = "JSON5 reads JSONC; there is no CST to edit in place."

[[ts]]
names = ["oxc-parser", "@babel/parser", "acorn", "espree"]
