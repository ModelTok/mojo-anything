name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  # Linux and macOS are the platforms Mojo runs on; there is no Windows job (use WSL).
  # MOJO_ANYTHING_REQUIRE turns a skipped language suite into a failure, so CI notices when a
  # runtime goes missing. Not required: kotlinc, php, dotnet and mojowasm (the wasm bridge's
  # toolchain is a separate checkout, github.com/lee101/mojo-wasm), whose tests skip here.
  linux:
    runs-on: ubuntu-24.04
    env:
      MOJO_ANYTHING_REQUIRE: node,python3,go,ruby,java,cc,mojo
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/check-secrets.sh --all
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install pixi (Mojo comes from it)
        run: |
          curl -fsSL https://pixi.sh/install.sh | PIXI_NO_PATH_UPDATE=1 bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - run: pixi install --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      # Java and Kotlin units call Mojo through FFM, which needs Java 22 or newer.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast
