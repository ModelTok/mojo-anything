name: Release

# Runs when a `v*` tag is pushed: builds the mojo-anything binary for each platform Mojo ships
# for, attaches the archives and SHA256SUMS to a GitHub release, then publishes the npm
# wrapper, whose launcher downloads those archives (npm/mojo-anything/bin/mojo-anything.js).
# The MCP Registry entry (server.json) is submitted by hand after npm has the version.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check the tag matches every version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          npm=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' npm/mojo-anything/package.json)
          server=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' server.json)
          for v in "$cargo" "$npm" "$server"; do
            test "$v" = "$tag" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $cargo, npm $npm, server.json $server"; exit 1; }
          done
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        # The launcher expects `mojo-anything-<tag>-<target>.tar.gz` holding
        # `mojo-anything-<tag>-<target>/mojo-anything`.
        run: |
          name="mojo-anything-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/mojo-anything" README.md LICENSE CHANGELOG.md "dist/$name/"
          cd dist
          tar czf "$name.tar.gz" "$name"
          rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{ if (on) exit; if (index($0, "## " v " ") == 1) { on = 1; next } } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  # After the release: the package holds only the launcher, which downloads the assets above.
  npm:
    needs: github
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - name: Publish to npm (trusted publishing)
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp README.md LICENSE npm/mojo-anything/
          if npm view "mojo-anything@$version" version > /dev/null 2>&1; then
            echo "mojo-anything@$version is already on npm"
          else
            npm publish ./npm/mojo-anything --access public
          fi
