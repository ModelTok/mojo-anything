[workspace]
name = "mojo-anything"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
# pixi-build builds EmberJson from its git tag: its conda build targets Mojo 1.1.
preview = ["pixi-build"]

[dependencies]
python = "3.12.*"
mojo = "==1.2.0"
emberjson = { git = "https://github.com/bgreni/EmberJson.git", tag = "0.5.0" }

[tasks]
# The Mojo tool (Phase 2): tool/build.sh and tool/check.sh.
build-tool = "bash tool/build.sh"
check-tool = "bash tool/check.sh"
